# Weekly dependency updates. A Playwright update (@playwright/test and playwright) also
# needs the mcr.microsoft.com/playwright image tag changed in the files that
# scripts/playwright-version.test.ts names when it fails.
#
# The imresamu/postgis image in the services: of .github/workflows/ci.yml and
# build-release.yml is not updated by Dependabot. Change it by hand, together with
# docker-compose.yml.
#
# The cooldown of 7 days is longer than pnpm's minimum release age, so pnpm never refuses
# a version Dependabot proposes.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # The types must match the runtime, Node.js 24 LTS (.node-version). A new major
      # comes together with a Node.js upgrade, as for the node image below.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # packages/api-client pins typescript 6.0.3 for @hey-api/openapi-ts, which crashes
      # on TypeScript 7 (see AGENTS.md, "Toolchain notes"). Ignoring by version would also
      # block updates of the root TypeScript 7, so ignore majors: a new TypeScript major
      # is a deliberate change anyway. Remove this when hey-api supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Both Playwright packages arrive in one pull request, also for major updates. A
      # package that matches several groups goes into the first one listed, so this group
      # stays above minor-and-patch (which also excludes them).
      playwright:
        patterns:
          - "@playwright/test"
          - playwright
      # Exact-pinned packages stay out of the group and arrive one by one for review, as
      # do all major updates.
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
        exclude-patterns:
          - "@hey-api/openapi-ts"
          - "drizzle-*"
          - oxlint
          - oxfmt
          - "@playwright/test"
          - playwright

  - package-ecosystem: github-actions
    # "/" covers the workflows; the composite actions need their own directories.
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infra/container
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Node.js 24 LTS is decided; a new major is a deliberate change, not a weekly update.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # The database must match Alwaysdata: PostgreSQL 18 with PostGIS 3.6. Dependabot reads
      # the tag 18-3.6-bookworm as version 18.3.6 with suffix -bookworm, so PostGIS 3.7
      # (18-3.7-bookworm) would count as a patch update and update-types cannot block it
      # without also blocking real patch updates. Ignore every version from 18.3.7 up
      # instead: that blocks 18-3.7-*, 18-4.*-* and 19-*. Write the version with dots: a
      # dash would make it a prerelease (18-3.7 parses as 18.pre.3.7).
      - dependency-name: imresamu/postgis
        versions: [">= 18.3.7"]
    groups:
      docker-compose:
        patterns: ["*"]
