# Builds the release once and deploys that same tarball: to staging on every push to main,
# then to production after a required reviewer of the production environment approves.
# Only main deploys: one Alwaysdata account holds both environments, so the staging
# credentials reach production too, and only reviewed code may hold them. Both GitHub
# environments allow the branch main only. The secrets live in those environments; the
# release job has no environment and sees none of them.
name: Deploy

on:
  push:
    branches:
      - main
    # A merge that changes only these cannot change the release, so it deploys nothing and
    # asks for no approval; staging and production keep the release they have. Every pattern
    # must be one that CI's release rule skips too (scripts/lib/ci-jobs.test.ts checks this).
    # The production job's check (scripts/deploy-current.ts) reads this list as well, so keep
    # each pattern a double-quoted item on its own line, using only "**", "*" and literal
    # characters.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - "**.test.ts"
      - "**.test.tsx"
      - "**.stories.tsx"
      - "packages/ui/src/__screenshots__/**"
      - "e2e/**"
  # By hand: run it from main (re-runs a deploy). From another branch the deploy jobs skip.
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency group: each deploy job has its own, which queues deploys of
# one environment instead of cancelling a deploy halfway. provision.yml and
# staging-services.yml use the same groups.

jobs:
  release:
    uses: ./.github/workflows/build-release.yml
    with:
      build-number: ${{ github.run_number }}
      retention-days: 30

  staging:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Worst case: setup, upload, migrations (at most 10 minutes), restart and health check,
    # then a rollback with its own restart and health check. Room for all of it.
    timeout-minutes: 35
    environment:
      name: staging
      url: https://staging.padvinder.net
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.release.outputs.artifact-name }}
      # Before the switch, so Sentry can read the stack traces of the new release from its first
      # error. Before the SSH key is loaded: the step runs a third-party image. A failed upload
      # is a warning, never a failed deploy; uploading the same maps twice is harmless.
      - name: Upload source maps
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: |
          tar -xzf padvinder-release.tar.gz release/sourcemaps
          scripts/upload-sourcemaps.sh release/sourcemaps
      # After the dependencies are installed, so no install script can use the key.
      - uses: ./.github/actions/alwaysdata-credentials
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Deploy
        env:
          ALWAYSDATA_ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
          ALWAYSDATA_API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
          COMMIT: ${{ github.sha }}
        run: >-
          pnpm infra:deploy --environment staging --tarball padvinder-release.tar.gz
          --commit "$COMMIT"
      - name: Stop the SSH agent
        if: always()
        run: |
          if [[ -n "${DEPLOY_SSH_AGENT_PID:-}" ]]; then
            SSH_AGENT_PID="$DEPLOY_SSH_AGENT_PID" ssh-agent -k >/dev/null 2>&1 ||
              echo "The SSH agent had already stopped."
          fi
          rm -f "$RUNNER_TEMP/ssh-agent.sock"

  production:
    needs: [release, staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Worst case: setup, upload, migrations (at most 10 minutes), restart and health check,
    # then a rollback with its own restart and health check. Room for all of it.
    timeout-minutes: 35
    # The required reviewers of this environment are the approval.
    environment:
      name: production
      url: https://padvinder.net
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check below needs the history of main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The approval may come long after the push. If main has since gained a commit that
      # changes the release, that commit's own run deploys it: do not put this older one live,
      # and fail, so a production job that deployed nothing never looks green. Commits that
      # change only paths in paths-ignore start no run, so this release is still the current
      # one: deploy it.
      - name: Check that this is still the current release of main
        env:
          COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/deploy-current.ts "$COMMIT" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.release.outputs.artifact-name }}
      # Before the switch, so Sentry can read the stack traces of the new release from its first
      # error. Before the SSH key is loaded: the step runs a third-party image. A failed upload
      # is a warning, never a failed deploy; uploading the same maps twice is harmless.
      - name: Upload source maps
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        run: |
          tar -xzf padvinder-release.tar.gz release/sourcemaps
          scripts/upload-sourcemaps.sh release/sourcemaps
      # After the dependencies are installed, so no install script can use the key.
      - uses: ./.github/actions/alwaysdata-credentials
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Deploy
        env:
          ALWAYSDATA_ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
          ALWAYSDATA_API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
          COMMIT: ${{ github.sha }}
        run: >-
          pnpm infra:deploy --environment production --tarball padvinder-release.tar.gz
          --commit "$COMMIT"
      - name: Stop the SSH agent
        if: always()
        run: |
          if [[ -n "${DEPLOY_SSH_AGENT_PID:-}" ]]; then
            SSH_AGENT_PID="$DEPLOY_SSH_AGENT_PID" ssh-agent -k >/dev/null 2>&1 ||
              echo "The SSH agent had already stopped."
          fi
          rm -f "$RUNNER_TEMP/ssh-agent.sock"
